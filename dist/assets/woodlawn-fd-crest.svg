</g>
<path transform="translate(-6 0)" d="M144 282 151 266 153 259 Q154 255 157 254 L159 257 157 267 154 272 Q162 272 165 278 L164 285 160 281 Q157 276 151 280 L148 284Z" fill="#f3ecd4"/>
<!-- Hydrant: smaller, inset from the arm border, with cap, body and side outlets. -->
