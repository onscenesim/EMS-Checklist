 <rect x="561" y="302" width="5" height="12" rx="1"/>
 <path d="M524 292v65m19-65v65" stroke="#b5b098" stroke-width="2"/>
</g>
<circle cx="320" cy="320" r="158" fill="#b5b098" stroke="#f3ecd4" stroke-width="6"/>
