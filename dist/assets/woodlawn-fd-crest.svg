 <rect x="518" y="286" width="32" height="76" rx="3"/>
 <rect x="509" y="362" width="50" height="8" rx="2"/>
 <rect x="506" y="373" width="56" height="9" rx="2"/>
 <path d="M507 299h11v18h-11zm43 0h11v18h-11z"/>
