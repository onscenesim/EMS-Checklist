<g fill="#f8f2db" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="middle" letter-spacing="1.2"><text><textPath href="#topRing" startOffset="50%">WOODLAWN</textPath></text><text><textPath href="#bottomRing" startOffset="50%">STATION 96</textPath></text></g>
<g font-family="Georgia,serif" font-weight="700" text-anchor="middle" fill="#d8d7cb" stroke="#f3ecd4" stroke-width="1.5"><text x="259" y="363" font-size="122">F</text><text x="377" y="363" font-size="122">D</text></g>
