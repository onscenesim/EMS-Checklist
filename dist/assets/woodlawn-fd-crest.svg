<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
<title id="title">Woodlawn Fire Department, Station 96</title><desc id="desc">Digitized Woodlawn crest: cream Maltese cross, red W over F D, ladder, hydrant, Fire and EMS.</desc>
<defs><path id="topRing" d="M194 320 A126 126 0 0 1 446 320"/><path id="bottomRing" d="M172 320 A148 148 0 0 0 468 320"/><path id="arm" d="M190 194 147 104 Q320 18 493 104 L450 194"/></defs>
<circle cx="320" cy="320" r="190" fill="#293331"/>
<g fill="#293331" stroke="#f3ecd4" stroke-width="10" stroke-linejoin="round"><use href="#arm"/><use href="#arm" transform="rotate(90 320 320)"/><use href="#arm" transform="rotate(180 320 320)"/><use href="#arm" transform="rotate(270 320 320)"/></g>
<g fill="#f3ecd4" font-family="Georgia,serif" font-weight="700" text-anchor="middle"><text x="320" y="132" font-size="57">FIRE</text><text x="320" y="548" font-size="55">EMS</text></g>
<!-- Ladder and hooked pike pole, fitted within the left cross arm. -->
<g stroke="#f3ecd4" stroke-width="6" stroke-linecap="round" fill="none">
